    <text x="91" y="79" class="en" font-weight="900" font-size="16" fill="#151926">H</text>
    <text x="126" y="79" class="en" font-weight="700" font-size="18" fill="#ffffff">Heurithm</text>
    <text x="80" y="120" font-size="13" fill="#8892a4">テクノロジーの力で新しい選択肢を創出する。</text>
    <text x="80" y="142" font-size="13" fill="#8892a4">クリエイターと企業をつなぐ「opusr」を運営。</text>

    <!-- Column: Services -->
    <text x="800" y="76" class="en" font-size="11" font-weight="700" fill="#5a6476">SERVICES</text>
    <text x="800" y="110" font-size="13" fill="#8892a4">opusr</text>
    <text x="800" y="142" font-size="13" fill="#8892a4">クリエイター登録</text>
    <text x="800" y="174" font-size="13" fill="#8892a4">企業向けサービス</text>
