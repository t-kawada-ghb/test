    <text x="1000" y="142" font-size="13" fill="#8892a4">ミッション</text>
    <text x="1000" y="174" font-size="13" fill="#8892a4">採用情報</text>
    <text x="1000" y="206" font-size="13" fill="#8892a4">ニュース</text>

    <!-- Column: Support -->
    <text x="1200" y="76" class="en" font-size="11" font-weight="700" fill="#5a6476">SUPPORT</text>
