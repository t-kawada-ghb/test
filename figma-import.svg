    <text x="80" y="364" font-size="12" fill="#5a6476">© 2025 Heurithm Inc. All rights reserved.</text>
    <text x="1100" y="364" font-size="12" fill="#5a6476">利用規約</text>
    <text x="1180" y="364" font-size="12" fill="#5a6476">プライバシーポリシー</text>
    <text x="1300" y="364" font-size="12" fill="#5a6476">特定商取引法</text>
