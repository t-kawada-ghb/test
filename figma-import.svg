  <!-- =================== CTA =================== -->
  <g id="CTA" transform="translate(0,2400)">
    <rect width="1440" height="480" fill="#151926"/>
    <line x1="0" y1="0" x2="1440" y2="0" stroke="#2a3450"/>
    <rect x="80" y="40" width="1280" height="400" rx="20" fill="#1f2840" stroke="#2a3450" stroke-width="1"/>
    <ellipse cx="720" cy="240" rx="300" ry="150" fill="#f5b510" fill-opacity="0.04"/>

    <text x="640" y="100" class="en" font-size="12" font-weight="600" fill="#f5b510">Get Started</text>
    <text x="360" y="148" font-size="40" font-weight="700" fill="#ffffff">あなたのクリエイティブを</text>
    <text x="380" y="198" font-size="40" font-weight="700" fill="#f5b510">ビジネスに変える一歩を</text>
    <text x="300" y="256" font-size="15" fill="#8892a4">登録無料。作品を公開するだけで、あなたの理想の案件が向こうからやってきます。</text>

    <!-- Primary btn -->
    <rect x="492" y="300" width="264" height="52" rx="6" fill="#f5b510"/>
    <text x="510" y="331" font-size="15" font-weight="600" fill="#151926">無料でクリエイター登録 →</text>

    <!-- Secondary btn -->
    <rect x="772" y="300" width="168" height="52" rx="6" fill="none" stroke="#3a4668" stroke-width="1"/>
    <text x="804" y="331" font-size="15" font-weight="500" fill="#ffffff">企業様はこちら</text>
  </g>

